<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" data-i18n="meta.description">
    <title data-i18n="meta.title">EJ</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">

    <script src="assets/js/app.js" defer></script>

<body>
    <div class="ambient-grid" aria-hidden="true"></div>
    <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Portfólio DW">
            <span>Desenvolvimento Web</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
            <a href="#equipe" data-i18n="nav.team"></a>
            <a href="#organizacao" data-i18n="organization.eyebrow"></a>
            <a href="#contato" data-i18n="nav.contact"></a>
            <div class="language-switcher" aria-label="Idioma">
                <button type="button" data-lang="pt-BR" aria-pressed="true">PT</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
        </nav>
    </header>

    <main id="inicio">
        <section class="section projects-section" id="projetos">
            <div class="section-heading reveal">
                <p class="eyebrow" data-i18n="projects.eyebrow"></p>
                <h2 data-i18n="projects.title"></h2>
                <p data-i18n="projects.description"></p>
                <span class="project-total"><strong>20</strong> <span data-i18n="projects.total"></span></span>
            </div>
            <div class="card-grid" id="projects-grid"></div>
        </section>

        <section class="section team-section" id="equipe">
            <div class="section-heading reveal">
                <p class="eyebrow" data-i18n="team.eyebrow"></p>
                <h2 data-i18n="team.title"></h2>
            </div>
            <div class="team-grid" id="team-grid"></div>
        </section>

        <section class="section organization-section" id="organizacao">
            <div class="section-heading reveal">
                <p class="eyebrow" data-i18n="organization.eyebrow"></p>
                <h2 data-i18n="organization.title"></h2>
                <p data-i18n="organization.description"></p>
            </div>
            <div class="organization-grid">
                <article class="info-card">
                    <span class="card-index">01</span>
                    <h3 data-i18n="organization.structure.title"></h3>
                    <p data-i18n="organization.structure.text"></p>
                </article>
                <article class="info-card">
                    <span class="card-index">02</span>
                    <h3 data-i18n="organization.future.title"></h3>
                    <p data-i18n="organization.future.text"></p>
                </article>
                <article class="info-card">
                    <span class="card-index">03</span>
                    <h3 data-i18n="organization.agreement.title"></h3>
                    <p data-i18n="organization.agreement.text"></p>
                </article>
                <article class="info-card">
                    <span class="card-index">04</span>
                    <h3 data-i18n="organization.tasks.title"></h3>
                    <p data-i18n="organization.tasks.text"></p>
                </article>
            </div>
        </section>

        <section class="section contact-section" id="contato">
            <div class="contact-panel reveal">
                <p class="eyebrow" data-i18n="contact.eyebrow"></p>
                <h2 data-i18n="contact.title"></h2>
                <p data-i18n="contact.description"></p>
                <div class="contact-actions">
                    <a class="button button-secondary" href="https://instagram.com/araujo_enz0" target="_blank" rel="noopener noreferrer" data-i18n="contact.instagram"></a>
                    <a class="button button-primary" href="https://wa.me/5551992528304?text=Ol%C3%A1!%20Gostaria%20de%20tirar%20uma%20d%C3%BAvida." target="_blank" rel="noopener noreferrer" data-i18n="contact.whatsapp"></a>
                    <a class="button button-secondary" href="https://github.com/PRO-HT" target="_blank" rel="noopener noreferrer" data-i18n="contact.github"></a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <span>Portfólio DW</span>
        <span data-i18n="footer.text"></span>
    </footer>
